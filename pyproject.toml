[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vm-ssh-manager"
version = "1.0.0"
description = "Windows utility to initialize SSH access for local Linux VMs"
requires-python = ">=3.11"
dependencies = ["paramiko>=3.5,<5"]

[project.optional-dependencies]
gui = ["PySide6>=6.7,<7"]
build = ["pyinstaller>=6.10,<7"]
test = ["pytest>=8,<10"]

[project.scripts]
vm-ssh-cli = "vmssh.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
